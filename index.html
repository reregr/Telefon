<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1220"><title>Telefoncu Simulator Full</title>
<style>
:root{--bg:#0a101b;--p:#141f2e;--p2:#1b2a3e;--line:#2b3d55;--tx:#edf4ff;--muted:#9aacc4;--green:#43d6a2;--gold:#ffc96b;--red:#ff7777;--blue:#70adff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:9;padding:13px 14px;background:linear-gradient(125deg,#1b3554,#101827);border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0}header small{color:#b2c5df}.stats{display:flex;gap:7px;overflow:auto;margin-top:10px}.stat{min-width:max-content;background:#0a1626;border:1px solid var(--line);border-radius:10px;padding:7px 9px}.stat span{display:block;color:var(--muted);font-size:10px}.stat b{font-size:14px;color:var(--green)}nav{position:sticky;top:91px;z-index:8;display:flex;overflow:auto;gap:6px;padding:8px;background:#0c1726;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;border:1px solid var(--line);background:var(--p);color:var(--muted);border-radius:9px;padding:9px 11px}nav button.active{background:#2a527e;color:#fff;border-color:#6095cc}main{max-width:900px;margin:auto;padding:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}.card h2{font-size:16px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:11px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{background:#0d1929;border:1px solid var(--line);padding:10px;border-radius:10px}.tile b{display:block;margin-top:3px}.btn{border:0;border-radius:9px;padding:9px 11px;margin:3px 3px 0 0;background:#2b6eaf;color:white;font-weight:650}.btn.green{background:#147b5c}.btn.gold{background:#875b18}.btn.red{background:#853c49}.btn.gray{background:#30435d}.btn:disabled{opacity:.4}.tag{font-size:10px;border-radius:30px;padding:4px 7px;background:#263b54;color:#d8e8ff}.price{color:var(--green);font-weight:750}.goldtxt{color:var(--gold)}.bad{color:var(--red)}.good{color:var(--green)}input,select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0b1523;color:#fff;margin:5px 0 9px}label{display:block;font-size:11px;color:var(--muted);margin-top:6px}.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}.notice{background:#172d44;border-left:3px solid var(--blue);border-radius:7px;padding:10px;margin:8px 0}.meter{height:7px;background:#34465e;border-radius:9px;overflow:hidden;margin:5px 0}.meter i{display:block;height:100%;background:var(--green)}.empty{text-align:center;color:var(--muted);padding:18px}.tabs2{display:flex;gap:5px;overflow:auto;margin-bottom:8px}.tabs2 button{white-space:nowrap;background:#22344c;color:#dceaff;border:0;border-radius:8px;padding:8px}.footer{text-align:center;color:#7588a1;font-size:10px;padding:20px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header><div class="row"><div><h1>📱 Telefoncu Simulator</h1><small id="dayname">1. Gün · Mahalle Telefoncusu</small></div><span class="tag">FULL EDITION 2.0</span></div><div class="stats"><div class="stat"><span>Kasa</span><b id="cash">₺30.000</b></div><div class="stat"><span>İtibar</span><b id="rep">10</b></div><div class="stat"><span>Dolar kuru</span><b id="fx">₺34,00</b></div><div class="stat"><span>Dükkan</span><b id="level">1. Seviye</b></div><div class="stat"><span>Günlük müşteri</span><b id="cust">0/5</b></div></div></header>
<nav id="nav"></nav><main id="app"></main><div class="footer">Telefoncu Simulator · Tek oyunculu · Çevrimdışı · Kayıt otomatik tutulur</div>
<script>
"use strict";
const $=id=>document.getElementById(id), fmt=n=>"₺"+Math.round(n).toLocaleString("tr-TR"), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[Math.floor(Math.random()*a.length)], uid=()=>Date.now()+rnd(1,99999);
const catalog=[
["Apple","iPhone 11",64,8500],["Apple","iPhone 11",128,9500],["Apple","iPhone 12",64,11200],["Apple","iPhone 12",128,12800],["Apple","iPhone 12 Pro",128,16000],["Apple","iPhone 13",128,17800],["Apple","iPhone 13",256,19500],["Apple","iPhone 13 Pro",128,23000],["Apple","iPhone 14",128,22500],["Apple","iPhone 14 Pro",128,29500],["Apple","iPhone 15",128,32500],["Apple","iPhone 15 Pro",256,43000],["Apple","iPhone 16",128,44500],["Apple","iPhone 16 Pro",256,58000],["Apple","iPhone SE 2022",64,9000],
["Samsung","Galaxy A14",128,5200],["Samsung","Galaxy A15",128,6800],["Samsung","Galaxy A25",128,9200],["Samsung","Galaxy A35",128,12500],["Samsung","Galaxy A55",256,16500],["Samsung","Galaxy S21",128,12500],["Samsung","Galaxy S21 FE",128,13500],["Samsung","Galaxy S22",128,17000],["Samsung","Galaxy S22 Ultra",256,26500],["Samsung","Galaxy S23",128,24500],["Samsung","Galaxy S23 Ultra",256,35500],["Samsung","Galaxy S24",128,31500],["Samsung","Galaxy S24 Ultra",256,49000],["Samsung","Galaxy Z Flip 5",256,26500],["Samsung","Galaxy Z Fold 5",512,49500],
["Xiaomi","Redmi 12",128,5800],["Xiaomi","Redmi Note 12",128,7400],["Xiaomi","Redmi Note 13",256,9500],["Xiaomi","Redmi Note 13 Pro",256,13700],["Xiaomi","Poco X5 Pro",256,11500],["Xiaomi","Poco X6 Pro",512,16200],["Xiaomi","Xiaomi 13T",256,19000],["Xiaomi","Xiaomi 13",256,22500],
["Google","Pixel 7",128,14500],["Google","Pixel 8",128,21500],["OnePlus","Nord 3",256,14500],["OnePlus","OnePlus 11",256,26000],["Huawei","P30 Pro",256,9500],["Huawei","Nova 11",256,11800],["Oppo","Reno 10",256,13500],["Oppo","A78",128,7600],["Realme","C55",128,6500],["Realme","11 Pro",256,12500],["Motorola","Edge 40",256,14500],["Nothing","Phone (2a)",128,15500]
].map((x,i)=>({id:i,brand:x[0],name:x[1],gb:x[2],base:x[3]}));
const partCatalog=[
{name:"iPhone uyumlu ekran",kind:"Ekran",after:1450,orig:3900,quality:"Muadil"},
{name:"Samsung AMOLED ekran",kind:"Ekran",after:1800,orig:4800,quality:"Muadil"},
{name:"Android LCD ekran",kind:"Ekran",after:850,orig:2100,quality:"Muadil"},
{name:"iPhone batarya",kind:"Batarya",after:650,orig:1550,quality:"Muadil"},
{name:"Samsung batarya",kind:"Batarya",after:550,orig:1250,quality:"Muadil"},
{name:"Şarj soketi",kind:"Şarj soketi",after:350,orig:900,quality:"Muadil"},
{name:"Ön kamera modülü",kind:"Ön kamera",after:700,orig:1850,quality:"Muadil"},
{name:"Arka kamera modülü",kind:"Arka kamera",after:1100,orig:2800,quality:"Muadil"},
{name:"Hoparlör modülü",kind:"Hoparlör",after:300,orig:750,quality:"Muadil"},
{name:"Arka kapak",kind:"Arka kapak",after:650,orig:1700,quality:"Muadil"},
{name:"Anakart onarım seti",kind:"Anakart",after:1800,orig:4200,quality:"Muadil"}
];
const accessoryCatalog=[
["20W USB-C adaptör",350,180],["25W hızlı şarj adaptörü",550,280],["USB-C kablo",180,80],["Lightning kablo",220,100],["Powerbank 10.000 mAh",850,470],["Şeffaf kılıf",180,65],["Darbeye dayanıklı kılıf",320,130],["9D ekran koruyucu",150,45],["Bluetooth kulaklık",650,330],["Araç şarjı",300,140],["Kablosuz şarj standı",900,520],["Telefon tutucu",220,95],["SIM iğnesi",35,8],["Type-C dönüştürücü",120,45]
];
const blank=()=>({day:1,cash:30000,rep:10,fx:34,level:1,inventory:[],parts:[],accessories:[],orders:[],listings:[],customers:[],log:["Dükkanın kapısını açtın. İlk iş günün başladı."],dailyCustomers:0,dailySales:0,rent:1200,staff:0,discount:false,loan:0,active:null,completed:0});
let state;try{state=JSON.parse(localStorage.getItem("telefoncu-full-save"))||blank()}catch(e){state=blank()}
let page="home",inspectId=null,repairId=null;
const pages=[["home","🏠 Dükkan"],["customers","🧍 Müşteriler"],["inventory","📦 Telefonlar"],["workshop","🛠️ Tamir"],["supplier","🚚 Toptancı"],["parts","🔩 Parçalar"],["classifieds","🌐 İlanlar"],["accessories","🎧 Aksesuar"],["finance","💰 Finans"],["upgrade","🏬 Geliştirme"],["records","📒 Defter"]];
function save(){localStorage.setItem("telefoncu-full-save",JSON.stringify(state));header()}
function note(t){state.log.unshift(`${state.day}. Gün: ${t}`);state.log=state.log.slice(0,100)}
function getModel(id){return catalog.find(m=>m.id===Number(id))}
function market(m){return Math.round(m.base*(state.fx/34)*(1+Math.sin(state.day/3)*.025))}
function phoneValue(p){let m=getModel(p.model);let v=market(m)*(p.condition/100)*(.62+p.battery/250);if(p.screen!=="Orijinal")v*=.91;if(p.faults.length)v*=Math.max(.45,1-p.faults.length*.11);if(p.icloud)v*=.2;return Math.round(v)}
function header(){$("dayname").textContent=`${state.day}. Gün · ${["Mahalle Telefoncusu","Gelişen Telefoncu","Teknoloji Merkezi"][state.level-1]||"Telefoncu Zinciri"}`;$("cash").textContent=fmt(state.cash);$("rep").textContent="⭐ "+state.rep;$("fx").textContent=fmt(state.fx);$("level").textContent=state.level+". Seviye";$("cust").textContent=state.dailyCustomers+"/"+(4+state.level*2)}
function go(p){page=p;render()}
function btn(t,fn,c=""){return `<button class="btn ${c}" onclick="${fn}">${t}</button>`}
function box(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function nav(){$("nav").innerHTML=pages.map(([id,t])=>`<button class="${page===id?"active":""}" onclick="go('${id}')">${t}</button>`).join("")}
function render(){
 nav();header();let out="";
 if(page==="home"){
 out+=box("İşletme kontrol paneli",`<div class="grid"><div class="tile"><span class="small">Bugünkü ciro</span><b>${fmt(state.dailySales)}</b></div><div class="tile"><span class="small">Stoktaki telefon</span><b>${state.inventory.length}</b></div><div class="tile"><span class="small">Tamir işi</span><b>${state.orders.length}</b></div><div class="tile"><span class="small">Aktif ilan</span><b>${state.listings.length}</b></div></div><div class="notice">Günlük kira ${fmt(state.rent)}. Müşteri memnuniyeti itibarını etkiler. Cihaz alırken IMEI ve iCloud/hesap kilidini kontrol et.</div>${btn("Müşteri çağır","spawnCustomer()","green")} ${btn("Günü kapat","endDay()","gold")} ${btn("Oyunu kaydet","save();alert('Oyun kaydedildi.')","gray")}`);
 out+=box("Bugünkü müşteriler",state.customers.length?state.customers.map(customerRow).join(""):"<div class='empty'>Henüz müşteri yok. Müşteri çağırarak iş başlat.</div>");
 out+=box("Stoktan hızlı bakış",state.inventory.slice(0,3).map(phoneRow).join("")||"<div class='empty'>Telefon stoğun boş.</div>");
 } else if(page==="customers"){
 out+=box("Müşteri kabul",`${btn("Yeni müşteri gelsin","spawnCustomer()","green")}<p class="small">Müşteriler telefon satmak, tamir ettirmek veya aksesuar almak için gelir. Her müşterinin bütçesi ve pazarlık karakteri farklıdır.</p>`);
 out+=box("Bekleyen müşteriler",state.customers.map(customerRow).join("")||"<div class='empty'>Bekleyen müşteri yok.</div>");
 if(inspectId){let c=state.customers.find(x=>x.id===inspectId);if(c)out+=inspectionHTML(c)}
 } else if(page==="inventory"){
 out+=box("Telefon envanteri",state.inventory.map(p=>phoneRow(p,true)).join("")||"<div class='empty'>Stok yok. Toptancıdan al veya müşteriden ikinci el satın al.</div>");
 } else if(page==="workshop"){
 out+=box("Tamir masası",`<p class="small">Tamir süreci: cihazı aç → arızayı doğrula → doğru parçayı seç → montajı yap → kalite testini geç → müşteriye teslim et veya stoğa geri koy.</p>`);
 out+=box("Devam eden işler",state.orders.map(orderRow).join("")||"<div class='empty'>Bekleyen tamir yok.</div>");
 if(repairId){let o=state.orders.find(x=>x.id===repairId);if(o)out+=repairBench(o)}
 out+=box("Kendi stoğundaki cihazı tamire al",state.inventory.length?`<select id="repairSelect">${state.inventory.map(p=>`<option value="${p.id}">${getModel(p.model).name} · ${p.faults.join(", ")||"Arızasız"}</option>`).join("")}</select><select id="repairFault"><option>Ekran</option><option>Batarya</option><option>Şarj soketi</option><option>Ön kamera</option><option>Arka kamera</option><option>Hoparlör</option><option>Arka kapak</option><option>Anakart</option></select>${btn("Tamir iş emri aç","createOwnRepair()")}`:"Stokta telefon yok.");
 } else if(page==="supplier"){
 out+=box("Toptancı pazarı",`<div class="notice">Dolar: <b>${fmt(state.fx)}</b> · ${state.discount?"Bugün %10 toptancı indirimi aktif!":"Kampanyalar rastgele günlerde açılır."}</div><input id="modelSearch" placeholder="Model ara..." oninput="filterCatalog()"><div id="catalogList">${catalogList(catalog)}</div>`);
 } else if(page==="parts"){
 out+=box("Yedek parça deposu",`<p class="small">Tamir başlamadan önce parçayı depodan kullan veya toptancıdan sipariş et. Orijinal parça daha pahalıdır; müşteri memnuniyetini artırır.</p>${partCatalog.map((p,i)=>{let qty=state.parts.filter(x=>x.kind===p.kind).length;return `<div class="item"><div class="row"><b>${p.name}</b><span class="tag">Stok: ${qty}</span></div><div class="row"><small>Muadil ${fmt(p.after)} · Orijinal ${fmt(p.orig)}</small>${btn("Muadil al","buyPart("+i+",'Muadil')")} ${btn("Orijinal al","buyPart("+i+",'Orijinal')","gold")}</div></div>`}).join("")}`);
 } else if(page==="classifieds"){
 out+=box("Telefon ilan sitesi",`<p class="small">İkinci el telefonlarını sanal ilan sitesine koy. İlanın görüntülenir, alıcı mesajı ve pazarlık teklifi gelir. İlanlar gerçek bir siteye yayınlanmaz.</p>${state.listings.map(l=>{let p=state.inventory.find(x=>x.id===l.phoneId);if(!p)return "";return `<div class="item"><b>${getModel(p.model).brand} ${getModel(p.model).name}</b><p class="small">Görüntülenme ${l.views} · Teklif ${l.offer?fmt(l.offer):"yok"} · İlan fiyatı ${fmt(l.price)}</p>${l.offer?btn("Teklifi kabul et","acceptListing("+l.id+")","green"):""} ${btn("Fiyatı %5 düşür","lowerListing("+l.id+")","gray")} ${btn("İlandan kaldır","removeListing("+l.id+")","red")}</div>`}).join("")||"<div class='empty'>Aktif ilan yok. Telefonlar sekmesinden ilan oluştur.</div>"}`);
 } else if(page==="accessories"){
 out+=box("Aksesuar satış rafı",state.accessories.map((a,i)=>`<div class="row item"><div><b>${a.name}</b><div class="small">Stok ${a.qty} · Satış ${fmt(a.sell)}</div></div>${btn("Sat","sellAccessory("+i+")","green")}</div>`).join("")||"<div class='empty'>Aksesuar stoğun boş.</div>");
 out+=box("Müşteriye aksesuar sat",`<p class="small">Toptancı sekmesinden aksesuar kolisi satın alıp burada satabilirsin.</p>`);
 } else if(page==="finance"){
 out+=box("Kasa ve işletme giderleri",`<div class="grid"><div class="tile">Kasa<b>${fmt(state.cash)}</b></div><div class="tile">Kira / gün<b>${fmt(state.rent)}</b></div><div class="tile">Toplam tamir<b>${state.completed}</b></div><div class="tile">Kredi borcu<b>${fmt(state.loan)}</b></div></div><p class="small">Kira her gün kapanışta ödenir. Nakit yetersizse itibarın düşer. Bu sürümde kredi sistemi açılabilir dükkân seviyesine bağlıdır.</p>${state.level>=2?btn("₺10.000 işletme kredisi al","takeLoan()","gold"):"Kredi için 2. seviye dükkân gerekli."}`);
 } else if(page==="upgrade"){
 let costs=[0,45000,110000];out+=box("Dükkan geliştirme",`<div class="tile">Seviye ${state.level} / 3<b>${["Mahalle Telefoncusu","Gelişen Telefoncu","Teknoloji Merkezi"][state.level-1]}</b></div><p class="small">Yeni seviyeler daha fazla müşteri, daha yüksek günlük müşteri limiti, geniş parça deposu ve daha iyi itibar getirir.</p>${state.level<3?btn("Dükkanı büyüt · "+fmt(costs[state.level]),"upgrade()","green"):"En üst seviyeye ulaştın!"}`);
 out+=box("Personel",`<p>Çalışan sayısı: <b>${state.staff}</b></p><p class="small">Her çalışan günlük müşteri kapasitesini artırır, ancak maaş gideri oluşturur.</p>${btn("Teknisyen işe al · ₺18.000","hire()","gold")}`);
 } else if(page==="records"){
 out+=box("İşletme defteri",state.log.map(x=>`<div class="item">${x}</div>`).join(""));
 }
 $("app").innerHTML=out;
}
function customerRow(c){return `<div class="item"><div class="row"><b>${c.name}</b><span class="tag">${c.type==="buy"?"Telefon satmak istiyor":c.type==="repair"?"Tamir istiyor":"Aksesuar arıyor"}</span></div><small class="muted">Bütçe ${fmt(c.budget)} · Sabır ${c.patience}/100 · ${c.personality}</small><div>${btn("Müşteriyi aç","openCustomer("+c.id+")")}</div></div>`}
function spawnCustomer(){
 let limit=4+state.level*2+state.staff;if(state.dailyCustomers>=limit)return alert("Bugünlük müşteri kapasiten doldu. Dükkanı geliştir veya yarını bekle.");
 let m=pick(catalog),type=pick(["buy","buy","repair","accessory"]),fault=pick(["Ekran","Batarya","Şarj soketi","Hoparlör","Arka kamera","Ön kamera","Anakart","Arka kapak"]),personality=pick(["Pazarlıkçı","Aceleci","Fiyat araştırmış","Sadık müşteri","Şüpheci"]);
 let c={id:uid(),type,model:m.id,name:pick(["Ahmet","Mehmet","Zeynep","Elif","Mert","Ayşe","Can","Ece"]),budget:Math.round(market(m)*rnd(65,115)/100),patience:rnd(45,100),personality,fault,condition:rnd(58,98),battery:rnd(65,100),screen:Math.random()<.14?"Muadil değişmiş":"Orijinal",face:Math.random()<.08?"Arızalı":"Çalışıyor",camera:Math.random()<.09?"Arızalı":"Çalışıyor",imei:Math.random()<.05?"Kayıt sorunu":"Temiz",icloud:Math.random()<.035,hidden:Math.random()<.2?pick(["Anakart","Sıvı teması","Şebeke"]):"",price:Math.round(market(m)*rnd(50,72)/100)};
 state.customers.unshift(c);state.dailyCustomers++;note(c.name+" isimli müşteri dükkana geldi.");save();go("customers");inspectId=c.id;render();
}
function openCustomer(id){inspectId=id;render()}
function inspectionHTML(c){
 let m=getModel(c.model),fair=market(m)*c.condition/100*c.battery/100*.9;if(c.screen!=="Orijinal")fair*=.9;if(c.face==="Arızalı"||c.camera==="Arızalı"||c.imei!=="Temiz"||c.icloud)fair*=.6;
 return box("Müşteri / ekspertiz",`<div class="row"><b>${c.name} · ${c.personality}</b><span class="tag">${c.type==="buy"?"İkinci el satış":c.type==="repair"?"Tamir kabul":"Aksesuar"}</span></div>${c.type==="buy"?`<h3>${m.brand} ${m.name} ${m.gb} GB</h3><div class="grid"><div class="tile">Kasa kondisyonu<b>%${c.condition}</b></div><div class="tile">Pil sağlığı<b>%${c.battery}</b></div><div class="tile">Ekran<b>${c.screen}</b></div><div class="tile">Face ID / Parmak izi<b>${c.face}</b></div><div class="tile">Kamera<b>${c.camera}</b></div><div class="tile">IMEI<b>${c.imei}</b></div><div class="tile">Hesap kilidi<b>${c.icloud?"Kilitli":"Temiz"}</b></div></div><div class="notice">Tahmini güvenli alım değeri: <b>${fmt(fair)}</b>. Gizli arıza ihtimali var; tüm kontrolleri yapmadan yüksek teklif verme.</div><label>Teklifin (TL)</label><input id="bid" type="number" value="${Math.round(fair*.82)}"><button class="btn green" onclick="bidCustomer(${c.id})">Teklif ver</button><button class="btn gray" onclick="counterOffer(${c.id})">Müşterinin istediği fiyat</button>`:c.type==="repair"?`<h3>${m.brand} ${m.name}</h3><p>Şikayet: <b>${c.fault}</b></p><p class="small">Ön kontrol ücreti ve teslim günü belirle. Arızayı test etmeden kesin fiyat verme.</p><label>İşçilik fiyatı</label><input id="labor" type="number" value="1200"><label>Teslim süresi</label><select id="days"><option value="1">1 gün</option><option value="2">2 gün</option><option value="3">3 gün</option></select>${btn("Tamir kabul et","acceptRepair("+c.id+")","green")}`:`<p>Müşteri aksesuar arıyor.</p>${accessoryCatalog.slice(0,8).map((a,i)=>btn(a[0]+" · "+fmt(a[1]*1.4),"sellToCustomer("+c.id+","+i+")")).join("")}`}${btn("Müşteriyi gönder","dismissCustomer("+c.id+")","red")}`);
}
function bidCustomer(id){let c=state.customers.find(x=>x.id===id),offer=Number($("bid").value),m=getModel(c.model);let fair=market(m)*c.condition/100*c.battery/100*.9;if(c.screen!=="Orijinal")fair*=.9;if(c.face==="Arızalı"||c.camera==="Arızalı"||c.imei!=="Temiz"||c.icloud)fair*=.6;if(c.hidden)fair*=.7;
 if(!offer||offer>state.cash)return alert("Teklif geçersiz veya kasan yetersiz.");if(offer>fair*1.12)return alert("Bu alış fiyatı riskli. Gerçekçi üst sınır yaklaşık "+fmt(fair*1.1));
 let target=c.price;if(offer>=target*.92&&Math.random()<.7){let p={id:uid(),model:c.model,cost:offer,condition:c.condition,battery:c.battery,screen:c.screen,faults:[],icloud:c.icloud,imei:c.imei,hidden:c.hidden,history:"Müşteriden alındı",quality:"İkinci el"};if(c.face==="Arızalı")p.faults.push("Biyometri");if(c.camera==="Arızalı")p.faults.push("Kamera");if(c.hidden)p.faults.push(c.hidden);if(c.imei!=="Temiz")p.faults.push("IMEI");state.cash-=offer;state.inventory.unshift(p);state.customers=state.customers.filter(x=>x.id!==id);state.rep+=1;note(m.name+" müşteriden "+fmt(offer)+" bedelle satın alındı.");inspectId=null;save();render()}else{c.patience-=20;alert("Müşteri kabul etmedi. Biraz daha teklif edebilir veya vazgeçebilirsin.");save();render()}
}
function counterOffer(id){let c=state.customers.find(x=>x.id===id);alert("Müşterinin istediği fiyat: "+fmt(c.price)+". Pazarlıkta teklifini buna yaklaştırabilirsin.")}
function dismissCustomer(id){state.customers=state.customers.filter(x=>x.id!==id);inspectId=null;note("Müşteri alışveriş yapmadan ayrıldı.");save();render()}
function acceptRepair(id){let c=state.customers.find(x=>x.id===id),labor=Number($("labor").value),days=Number($("days").value);if(labor<200)return alert("İşçilik çok düşük.");state.orders.push({id:uid(),customerId:id,title:getModel(c.model).name,model:c.model,fault:c.fault,labor,due:state.day+days,step:0,part:null,customer:true,deposit:Math.round(labor*.3)});state.cash+=Math.round(labor*.3);state.customers=state.customers.filter(x=>x.id!==id);inspectId=null;note(c.name+" için tamir kabul edildi. Tahmini teslim "+(state.day+days)+". gün.");save();go("workshop")}
function createOwnRepair(){let p=state.inventory.find(x=>x.id===Number($("repairSelect").value)),fault=$("repairFault").value;if(!p)return;state.orders.push({id:uid(),phoneId:p.id,title:getModel(p.model).name,model:p.model,fault, labor:0,due:state.day+1,step:0,part:null,customer:false});note(p.id+" numaralı stok cihazı tamire alındı.");save();render()}
function orderRow(o){return `<div class="item"><div class="row"><b>${o.title}</b><span class="tag">Teslim: ${o.due}. gün</span></div><small class="muted">${o.fault} · Aşama ${o.step}/4 · ${o.part?o.part.name+" ("+o.part.quality+")":"Parça seçilmedi"}</small><div>${btn("Tamir tezgahına geç","openRepair("+o.id+")","green")}</div></div>`}
function openRepair(id){repairId=id;go("workshop")}
function repairBench(o){
 let p=partCatalog.find(x=>x.kind===o.fault)||partCatalog.find(x=>x.kind==="Ekran");
 let partChoices=partCatalog.filter(x=>x.kind===o.fault||o.fault==="Anakart"||x.kind==="Ekran");
 return box("🔧 Tamir tezgahı · "+o.title,`<div class="notice">Arıza: <b>${o.fault}</b>. İşlem sırası: söküm, teşhis, parça montajı, kalite kontrol.</div><div class="meter"><i style="width:${o.step*25}%"></i></div><p>Aşama ${o.step}/4</p>${o.step===0?`<p>Önce cihazı güvenli biçimde aç. Yanlış müdahale kasaya zarar verebilir.</p>${btn("Cihazı aç ve vidaları sök","repairStep("+o.id+")","green")}`:o.step===1?`<p>Arızayı doğrula ve uyumlu yedek parçayı seç.</p><select id="partChoice">${partChoices.map((x,i)=>`<option value="${partCatalog.indexOf(x)}">${x.name} · Muadil ${fmt(x.after)} / Orijinal ${fmt(x.orig)}</option>`).join("")}</select><select id="partQuality"><option>Muadil</option><option>Orijinal</option></select>${btn("Parçayı seç ve teşhis et","selectRepairPart("+o.id+")","green")}`:o.step===2?`<p>Parça seçildi: <b>${o.part.name} · ${o.part.quality}</b></p>${btn("Montajı tamamla","repairStep("+o.id+")","green")}`:o.step===3?`<p>Montaj tamamlandı. Şimdi ekran, şarj, kamera, ses ve biyometri testlerini çalıştır.</p>${btn("Kalite testini çalıştır","qualityTest("+o.id+")","gold")}`:`<p class="good">Test tamamlandı. Cihaz teslimata hazır.</p>${btn("Müşteriye teslim et / stoğa al","deliverRepair("+o.id+")","green")}`);
}
function repairStep(id){let o=state.orders.find(x=>x.id===id);if(!o)return;o.step++;note(o.title+" tamir aşaması "+o.step+" tamamlandı.");save();render()}
function selectRepairPart(id){let o=state.orders.find(x=>x.id===id),p=partCatalog[Number($("partChoice").value)],quality=$("partQuality").value,price=quality==="Orijinal"?p.orig:p.after;let stock=state.parts.find(x=>x.kind===p.kind&&x.quality===quality);if(stock){state.parts.splice(state.parts.indexOf(stock),1)}else{if(state.cash<price)return alert("Bu parça için kasan yetmiyor. Parçalar sekmesinden stok al.");state.cash-=price}
 o.part={name:p.name,kind:p.kind,quality,cost:price};o.step=2;save();render()}
function qualityTest(id){let o=state.orders.find(x=>x.id===id);let chance=o.part.quality==="Orijinal"?.96:.84;if(Math.random()>chance){alert("Test başarısız! Bağlantıyı yeniden kontrol et. Bir aşama geri alındı.");o.step=2;state.rep=Math.max(0,state.rep-1)}else{o.step=4;alert("Test başarılı: ekran, şarj, ses ve kamera kontrolleri geçti.");}save();render()}
function deliverRepair(id){let o=state.orders.find(x=>x.id===id);if(o.customer){state.cash+=o.labor-Math.round(o.labor*.3);state.rep+=2}else{let p=state.inventory.find(x=>x.id===o.phoneId);if(p){p.faults=p.faults.filter(f=>f!==o.fault);p.condition=Math.min(100,p.condition+12);p.cost+=o.part.cost;p.quality=o.part.quality+" parça";}}state.orders=state.orders.filter(x=>x.id!==id);state.completed++;note(o.title+" tamiri teslim edildi.");repairId=null;save();render()}
function phoneRow(p,actions=false){let m=getModel(p.model);return `<div class="item"><div class="row"><b>${m.brand} ${m.name} ${m.gb} GB</b><span class="tag">%${p.condition} kondisyon</span></div><small class="muted">Pil %${p.battery} · Ekran ${p.screen} · ${p.faults.length?p.faults.join(", "):"Arıza yok"} · ${p.quality||"Stok"}</small><div class="row"><span>Alış ${fmt(p.cost)}</span><b class="price">Tahmini ${fmt(phoneValue(p))}</b></div>${actions?`${btn("Sat","sellPhone("+p.id+")","green")} ${btn("İlan ver","listPhone("+p.id+")")} ${btn("Tamire al","quickRepair("+p.id+")","gold")}`:""}</div>`}
function catalogList(arr){return arr.map(m=>`<div class="item"><div class="row"><b>${m.brand} ${m.name} ${m.gb} GB</b><span class="price">${fmt(market(m))}</span></div><small class="muted">Toptan fiyat · piyasa kuruna bağlı</small>${btn("Satın al","buyStock("+m.id+")","green")}</div>`).join("")}
function filterCatalog(){let q=$("modelSearch").value.toLowerCase();$("catalogList").innerHTML=catalogList(catalog.filter(m=>(m.brand+" "+m.name).toLowerCase().includes(q)))}
function buyStock(id){let m=getModel(id),price=market(m)*(state.discount?.9:1);if(state.cash<price)return alert("Kasada yeterli para yok.");state.cash-=price;state.inventory.push({id:uid(),model:id,cost:price,condition:100,battery:100,screen:"Orijinal",faults:[],icloud:false,imei:"Temiz",hidden:"",quality:"Sıfır"});note(m.name+" toptancıdan alındı: "+fmt(price));save();render()}
function sellPhone(id){let p=state.inventory.find(x=>x.id===id);if(!p)return;let price=Math.round(phoneValue(p)*.96);if(p.icloud||p.faults.includes("IMEI"))price=Math.round(price*.25);state.cash+=price;state.dailySales+=price;state.inventory=state.inventory.filter(x=>x.id!==id);state.listings=state.listings.filter(x=>x.phoneId!==id);state.rep+=1;note(getModel(p.model).name+" dükkanda "+fmt(price)+" bedelle satıldı.");save();render()}
function quickRepair(id){let p=state.inventory.find(x=>x.id===id);if(!p)return;if(!p.faults.length)p.faults.push("Batarya");state.orders.push({id:uid(),phoneId:id,title:getModel(p.model).name,model:p.model,fault:p.faults[0],labor:0,due:state.day+1,step:0,part:null,customer:false});go("workshop")}
function listPhone(id){let p=state.inventory.find(x=>x.id===id);if(!p)return;if(state.listings.some(l=>l.phoneId===id))return alert("Bu telefon zaten ilanda.");state.listings.push({id:uid(),phoneId:id,price:Math.round(phoneValue(p)*1.2),views:0,offer:0});note(getModel(p.model).name+" ilan sitesinde yayınlandı.");save();go("classifieds")}
function acceptListing(id){let l=state.listings.find(x=>x.id===id),p=state.inventory.find(x=>x.id===l.phoneId);if(!l||!p)return;let sale=l.offer||l.price*.92;state.cash+=sale;state.dailySales+=sale;state.inventory=state.inventory.filter(x=>x.id!==p.id);state.listings=state.listings.filter(x=>x.id!==id);state.rep++;note(getModel(p.model).name+" ilan üzerinden "+fmt(sale)+" bedelle satıldı.");save();render()}
function lowerListing(id){let l=state.listings.find(x=>x.id===id);if(l){l.price=Math.round(l.price*.95);save();render()}}
function removeListing(id){state.listings=state.listings.filter(x=>x.id!==id);save();render()}
function buyPart(i,q){let p=partCatalog[i],cost=q==="Orijinal"?p.orig:p.after;if(state.cash<cost)return alert("Yetersiz bakiye.");state.cash-=cost;state.parts.push({kind:p.kind,name:p.name,quality:q});note(p.name+" ("+q+") yedek parça alındı.");save();render()}
function buyAccessory(i){let a=accessoryCatalog[i],cost=a[1];if(state.cash<cost)return alert("Yetersiz bakiye.");state.cash-=cost;let found=state.accessories.find(x=>x.name===a[0]);if(found)found.qty++;else state.accessories.push({name:a[0],qty:1,cost,sell:Math.round(cost*1.5)});note(a[0]+" stoğa alındı.");save();render()}
function sellAccessory(i){let a=state.accessories[i];if(!a||a.qty<=0)return;let price=a.sell;a.qty--;state.cash+=price;state.dailySales+=price;note(a.name+" "+fmt(price)+" bedelle satıldı.");save();render()}
function sellToCustomer(cid,i){let c=state.customers.find(x=>x.id===cid),a=accessoryCatalog[i],stock=state.accessories.find(x=>x.name===a[0]&&x.qty>0);if(!stock)return alert("Bu üründen stokta yok. Toptancıdan al.");stock.qty--;let price=Math.round(a[1]*1.4);state.cash+=price;state.dailySales+=price;state.customers=state.customers.filter(x=>x.id!==cid);inspectId=null;state.rep++;note(c.name+" "+a[0]+" satın aldı.");save();render()}
function endDay(){let expenses=state.rent+state.staff*650;state.cash-=expenses;if(state.cash<0){state.rep=Math.max(0,state.rep-2);note("Giderler ödenemedi. İtibar azaldı.")}else note("Günlük kira ve maaş ödendi: "+fmt(expenses));state.day++;state.dailyCustomers=0;state.dailySales=0;state.fx=Math.max(28,Math.min(55,state.fx+(Math.random()-.46)*.9));state.discount=Math.random()<.22;state.listings.forEach(l=>{l.views+=rnd(4,25);if(!l.offer&&Math.random()<.35)l.offer=Math.round(l.price*rnd(82,96)/100)});state.orders.forEach(o=>{if(o.due<state.day&&o.customer){state.rep=Math.max(0,state.rep-1);note(o.title+" tamiri gecikti; müşteri şikayetçi.")}});state.customers=[];save();go("home");alert("Yeni gün başladı. Dolar kuru ve piyasa güncellendi."+ (state.discount?" Bugün toptancı indirimi var!":""))}
function upgrade(){let cost=state.level===1?45000:110000;if(state.level>=3)return;if(state.cash<cost)return alert("Yeterli paran yok.");state.cash-=cost;state.level++;state.rent+=1000;state.rep+=5;note("Dükkan "+state.level+". seviyeye yükseltildi.");save();render()}
function hire(){if(state.cash<18000)return alert("Yeterli paran yok.");state.cash-=18000;state.staff++;note("Yeni teknisyen işe alındı.");save();render()}
function takeLoan(){if(state.loan>0)return alert("Önce mevcut kredini kapat.");state.cash+=10000;state.loan=12000;note("₺10.000 kredi alındı. Geri ödeme ₺12.000.");save();render()}
function resetGame(){if(confirm("Bütün kayıt silinecek. Yeni oyuna başlansın mı?")){state=blank();save();go("home")}}
render();
</script></body></html>
